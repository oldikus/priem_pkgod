<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приемная комиссия - ЕПК</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Дополнительные стили для каркаса */
        .sidebar { width: 280px; background: var(--bg-card); border-right: 1px solid var(--border); position: fixed; height: 100vh; overflow-y: auto; }
        .logo-area { padding: 24px; border-bottom: 1px solid var(--border); }
        .logo-area h1 { font-size: 20px; font-weight: 700; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-area p { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
        .nav-menu { padding: 20px 16px; }
        .nav-group { margin-bottom: 24px; }
        .nav-group-title { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 12px; padding-left: 12px; cursor: pointer; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin-bottom: 4px; border-radius: 10px; color: var(--text-secondary); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .nav-item:hover { background: rgba(79,70,229,0.1); color: var(--text-primary); }
        .nav-item.active { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; }
        .nav-divider { height: 1px; background: var(--border); margin: 16px 0; }
        
        .main-content { margin-left: 280px; padding: 24px 32px; min-height: 100vh; }
        .top-bar { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 32px; }
        .user-info { text-align: right; }
        .user-name { font-weight: 600; font-size: 14px; }
        .user-role { font-size: 12px; color: var(--text-secondary); }
        .logout-btn { padding: 8px 16px; background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); border-radius: 10px; color: #f87171; cursor: pointer; font-size: 13px; margin-top: 8px; transition: all 0.2s; }
        .logout-btn:hover { background: var(--danger); color: white; }
        
        .page-content { animation: fadeIn 0.3s ease; }
        .loader-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 2000; display: none; }
        .loader-spinner { width: 50px; height: 50px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        @media (max-width: 768px) { 
            .sidebar { transform: translateX(-100%); z-index: 1000; transition: transform 0.3s; } 
            .sidebar.open { transform: translateX(0); } 
            .main-content { margin-left: 0; } 
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="logo-area">
            <h1>📄 Приемная комиссия</h1>
            <p>Единая платформа</p>
        </div>
        <div class="nav-menu">
            <div class="nav-group">
                <div class="nav-group-title">ОСНОВНОЕ</div>
                <div class="nav-item active" data-page="home">🏠 Главная</div>
                <div class="nav-item" data-page="create">📝 Создать расписку</div>
                <div class="nav-item" data-page="history">📋 Мои расписки</div>
                <div class="nav-item" data-page="profile">👤 Профиль</div>
            </div>
            <div class="nav-group">
                <div class="nav-group-title">ПРИЕМНАЯ КАМПАНИЯ</div>
                <div class="nav-item" data-page="rating">🏆 Рейтинговые списки</div>
                <div class="nav-item" data-page="export">📤 Экспорт в ФИС ГИА</div>
            </div>
            <div class="nav-group" id="statsGroup" style="display: none;">
                <div class="nav-group-title">АНАЛИТИКА</div>
                <div class="nav-item" data-page="stats">📊 Статистика</div>
                <div class="nav-item" data-page="charts">📈 Графики</div>
            </div>
            <div class="nav-divider" id="adminDivider" style="display: none;"></div>
            <div class="nav-group" id="adminGroup" style="display: none;">
                <div class="nav-group-title">УПРАВЛЕНИЕ</div>
                <div class="nav-item" data-page="admin">⚙️ Админ панель</div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <div class="user-info">
                <div class="user-name" id="userName"></div>
                <div class="user-role" id="userRole"></div>
                <button class="logout-btn" onclick="logout()">Выйти</button>
            </div>
        </div>
        
        <div id="pageContent" class="page-content">
            <div class="loader-overlay" id="loaderOverlay"><div class="loader-spinner"></div></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        // ========== ПРОВЕРКА АВТОРИЗАЦИИ ==========
        let currentUser = null;
        
        function init() {
            currentUser = checkAuth();
            if (!currentUser) { 
                window.location.href = 'login.html'; 
                return; 
            }
            
            document.getElementById('userName').innerHTML = currentUser.name;
            
            let roleText = '';
            if (currentUser.role === 'admin') roleText = 'Главный администратор';
            else if (currentUser.role === 'both') roleText = 'Администратор + Сотрудник';
            else if (currentUser.role === 'manager') roleText = 'Руководитель';
            else roleText = 'Сотрудник архива';
            document.getElementById('userRole').innerHTML = roleText;
            
            if (currentUser.role === 'admin' || currentUser.role === 'both' || currentUser.role === 'manager') {
                document.getElementById('statsGroup').style.display = 'block';
            }
            if (currentUser.role === 'admin' || currentUser.role === 'both') {
                document.getElementById('adminGroup').style.display = 'block';
                document.getElementById('adminDivider').style.display = 'block';
            }
            
            // Загружаем главную страницу
            loadPage('home');
        }
        
        // ========== ЗАГРУЗКА СТРАНИЦ ==========
        function loadPage(pageName) {
            const loader = document.getElementById('loaderOverlay');
            const container = document.getElementById('pageContent');
            loader.style.display = 'flex';
            
            // Для админки отдельный файл в корне
            let url = pageName === 'admin' ? 'admin.html' : `pages/${pageName}.html`;
            
            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error('Страница не найдена');
                    return response.text();
                })
                .then(html => {
                    container.innerHTML = html;
                    // Выполняем скрипты из загруженной страницы
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        if (oldScript.src) {
                            newScript.src = oldScript.src;
                        } else {
                            newScript.textContent = oldScript.textContent;
                        }
                        document.body.appendChild(newScript);
                    });
                    loader.style.display = 'none';
                })
                .catch(error => {
                    container.innerHTML = '<div class="empty-state">❌ Ошибка загрузки страницы</div>';
                    loader.style.display = 'none';
                });
            
            // Обновляем активный пункт меню
            document.querySelectorAll('.nav-item').forEach(item => {
                if (item.getAttribute('data-page') === pageName) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }
        
        // ========== ОБРАБОТЧИКИ МЕНЮ ==========
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const page = this.getAttribute('data-page');
                loadPage(page);
            });
        });
        
        // Функция выхода
        function logout() {
            localStorage.removeItem('receipt_system_current_user');
            window.location.href = 'login.html';
        }
        
        // Делаем функции глобальными для доступа из загруженных страниц
        window.currentUser = currentUser;
        window.loadPage = loadPage;
        window.logout = logout;
        window.showToast = function(msg, type) {
            const toast = document.createElement('div');
            toast.style.position = 'fixed';
            toast.style.bottom = '20px';
            toast.style.right = '20px';
            toast.style.background = 'var(--bg-card)';
            toast.style.borderLeft = '4px solid ' + (type === 'success' ? 'var(--success)' : 'var(--danger)');
            toast.style.padding = '12px 20px';
            toast.style.borderRadius = '10px';
            toast.style.zIndex = '1100';
            toast.style.color = 'var(--text-primary)';
            toast.innerHTML = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        };
        window.printReceipt = function(receipt) {
            const now = new Date();
            const w = window.open('', '_blank');
            let docHtml = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Расписка №' + receipt.receiptNumber + '</title><style>body{font-family:"Times New Roman",serif;padding:40px;max-width:800px;margin:0 auto;background:white;color:black;}.header{text-align:center;margin-bottom:30px;}h3{font-size:18px;font-weight:bold;margin:20px 0;}.content{line-height:1.6;}.signature{margin-top:50px;}button{padding:10px 20px;background:#4CAF50;color:white;border:none;border-radius:5px;cursor:pointer;margin-right:10px;}@media print{.no-print{display:none;}}</style></head><body><div class="no-print" style="text-align:center;margin-bottom:20px;"><button onclick="window.print()">🖨️ Печать</button><button onclick="window.close()">✖️ Закрыть</button></div><div class="header"><h3>РАСПИСКА</h3><p>о приёме документов</p></div><div class="content"><p>Настоящая расписка выдана абитуриенту <strong>' + receipt.fullName + '</strong> о том, что от него приняты следующие документы:</p><ul>';
            const docs = (receipt.documents || '').split('\n');
            for (let i = 0; i < docs.length; i++) { if (docs[i].trim()) docHtml += '<li>' + docs[i].trim() + '</li>'; }
            docHtml += '</ul><p><strong>Специальность:</strong> ' + receipt.specialty + '</p><p><strong>Номер расписки:</strong> ' + receipt.receiptNumber + '</p><p><strong>Дата выдачи:</strong> ' + now.toLocaleDateString('ru-RU') + '</p><div class="signature"><p>____________________</p><p><strong>' + receipt.employee + '</strong></p><p>' + receipt.employeePosition + '</p></div></div><script>setTimeout(function(){window.print();},500);<\/script></body></html>';
            w.document.write(docHtml);
            w.document.close();
        };
        
        // Запуск
        init();
    </script>
</body>
</html>
