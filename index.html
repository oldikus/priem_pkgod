<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приемная комиссия - ЕПК</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Стили для каркаса */
        .sidebar { width: 280px; background: var(--bg-card); border-right: 1px solid var(--border); position: fixed; height: 100vh; overflow-y: auto; }
        .logo-area { padding: 24px; border-bottom: 1px solid var(--border); }
        .logo-area h1 { font-size: 20px; font-weight: 700; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-area p { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
        .nav-menu { padding: 20px 16px; }
        .nav-group { margin-bottom: 24px; }
        .nav-group-title { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 12px; padding-left: 12px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin-bottom: 4px; border-radius: 10px; color: var(--text-secondary); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .nav-item:hover { background: rgba(79,70,229,0.1); color: var(--text-primary); }
        .nav-item.active { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; }
        .nav-divider { height: 1px; background: var(--border); margin: 16px 0; }
        .main-content { margin-left: 280px; padding: 24px 32px; transition: all 0.3s ease; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .greeting h2 { font-size: 24px; font-weight: 700; color: var(--text-primary); }
        .greeting p { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }
        .user-controls { display: flex; align-items: center; gap: 20px; }
        .user-info { text-align: right; }
        .user-name { font-weight: 600; font-size: 14px; }
        .user-role { font-size: 12px; color: var(--text-secondary); }
        .logout-btn { padding: 8px 16px; background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); border-radius: 10px; color: #f87171; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .logout-btn:hover { background: var(--danger); color: white; }
        .page-content { animation: fadeIn 0.3s ease; min-height: 400px; }
        .loader-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 2000; display: none; }
        .loader-spinner { width: 50px; height: 50px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 768px) { .sidebar { transform: translateX(-100%); z-index: 1000; } .main-content { margin-left: 0; } }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo-area">
            <h1>📄 Приемная комиссия</h1>
            <p>Единая платформа</p>
        </div>
        <div class="nav-menu">
            <div class="nav-group">
                <div class="nav-group-title">ОСНОВНОЕ</div>
                <div class="nav-item active" data-page="home"><span>🏠</span> Главная</div>
                <div class="nav-item" data-page="create"><span>📝</span> Создать расписку</div>
                <div class="nav-item" data-page="history"><span>📋</span> Мои расписки</div>
                <div class="nav-item" data-page="profile"><span>👤</span> Профиль</div>
            </div>
            <div class="nav-group">
                <div class="nav-group-title">ПРИЕМНАЯ КАМПАНИЯ</div>
                <div class="nav-item" data-page="rating"><span>🏆</span> Рейтинговые списки</div>
                <div class="nav-item" data-page="export"><span>📤</span> Экспорт в ФИС ГИА</div>
            </div>
            <div class="nav-group" id="statsGroup" style="display: none;">
                <div class="nav-group-title">АНАЛИТИКА</div>
                <div class="nav-item" data-page="stats"><span>📊</span> Статистика</div>
                <div class="nav-item" data-page="charts"><span>📈</span> Графики</div>
            </div>
            <div class="nav-divider" id="adminDivider" style="display: none;"></div>
            <div class="nav-group" id="adminGroup" style="display: none;">
                <div class="nav-group-title">УПРАВЛЕНИЕ</div>
                <div class="nav-item" data-page="admin"><span>⚙️</span> Админ панель</div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <div class="greeting">
                <h2>Привет, <span id="userNameShort"></span> 😊</h2>
                <p>Отдых на выходных — лучшая профилактика авралов.</p>
            </div>
            <div class="user-controls">
                <div class="user-info">
                    <div class="user-name" id="userName"></div>
                    <div class="user-role" id="userRole"></div>
                </div>
                <button class="logout-btn" onclick="logout()">Выйти</button>
            </div>
        </div>

        <div id="pageContent">
            <div class="loader-overlay" id="loaderOverlay"><div class="loader-spinner"></div></div>
            <div style="text-align: center; padding: 40px; color: var(--text-secondary);" id="loadingMessage">Загрузка...</div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        // ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
        var currentUser = null;
        
        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        function init() {
            console.log('🔍 Проверка авторизации...');
            currentUser = checkAuth();
            if (!currentUser) { 
                console.log('❌ Не авторизован, перенаправление на login.html');
                window.location.href = 'login.html'; 
                return; 
            }
            console.log('✅ Авторизован:', currentUser.name);
            
            var firstName = currentUser.name.split(' ')[1] || currentUser.name.split(' ')[0];
            var userNameShortEl = document.getElementById('userNameShort');
            var userNameEl = document.getElementById('userName');
            var userRoleEl = document.getElementById('userRole');
            
            if (userNameShortEl) userNameShortEl.innerHTML = firstName;
            if (userNameEl) userNameEl.innerHTML = currentUser.name;
            
            var roleText = '';
            if (currentUser.role === 'admin') roleText = 'Главный администратор';
            else if (currentUser.role === 'both') roleText = 'Администратор + Сотрудник';
            else if (currentUser.role === 'manager') roleText = 'Руководитель';
            else roleText = 'Сотрудник архива';
            if (userRoleEl) userRoleEl.innerHTML = roleText;
            
            var statsGroup = document.getElementById('statsGroup');
            var adminGroup = document.getElementById('adminGroup');
            var adminDivider = document.getElementById('adminDivider');
            
            if (currentUser.role === 'admin' || currentUser.role === 'both' || currentUser.role === 'manager') {
                if (statsGroup) statsGroup.style.display = 'block';
            }
            if (currentUser.role === 'admin' || currentUser.role === 'both') {
                if (adminGroup) adminGroup.style.display = 'block';
                if (adminDivider) adminDivider.style.display = 'block';
            }
            
            loadPage('home');
        }
        
        // ========== ЗАГРУЗКА СТРАНИЦ ==========
        function loadPage(pageName) {
            var loader = document.getElementById('loaderOverlay');
            var container = document.getElementById('pageContent');
            var loadingMsg = document.getElementById('loadingMessage');
            
            if (loader) loader.style.display = 'flex';
            if (loadingMsg) loadingMsg.style.display = 'none';
            
            var url = (pageName === 'admin') ? 'admin.html' : 'pages/' + pageName + '.html';
            console.log('📄 Загрузка страницы:', url);
            
            fetch(url + '?v=' + Date.now())
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error('Страница не найдена: ' + url);
                    }
                    return response.text();
                })
                .then(function(html) {
                    if (container) {
                        container.innerHTML = html;
                        // Выполняем скрипты из загруженной страницы
                        var scripts = container.querySelectorAll('script');
                        for (var i = 0; i < scripts.length; i++) {
                            var oldScript = scripts[i];
                            var newScript = document.createElement('script');
                            if (oldScript.src) {
                                newScript.src = oldScript.src;
                            } else {
                                newScript.textContent = oldScript.textContent;
                            }
                            document.body.appendChild(newScript);
                        }
                    }
                    if (loader) loader.style.display = 'none';
                    console.log('✅ Страница загружена:', pageName);
                })
                .catch(function(error) {
                    console.error('❌ Ошибка загрузки:', error);
                    if (container) {
                        container.innerHTML = '<div class="empty-state">❌ Ошибка загрузки страницы: ' + pageName + '<br>' + error.message + '</div>';
                    }
                    if (loader) loader.style.display = 'none';
                });
            
            // Обновляем активный пункт меню
            var navItems = document.querySelectorAll('.nav-item');
            for (var i = 0; i < navItems.length; i++) {
                var item = navItems[i];
                if (item.getAttribute('data-page') === pageName) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            }
        }
        
        // ========== ОБРАБОТЧИКИ ==========
        function setupEventListeners() {
            var navItems = document.querySelectorAll('.nav-item');
            for (var i = 0; i < navItems.length; i++) {
                navItems[i].onclick = function(e) {
                    e.preventDefault();
                    var page = this.getAttribute('data-page');
                    loadPage(page);
                };
            }
        }
        
        function logout() { 
            localStorage.removeItem('receipt_system_current_user'); 
            window.location.href = 'login.html'; 
        }
        
        // Делаем глобальные функции для доступа из загруженных страниц
        window.currentUser = function() { return currentUser; };
        window.loadPage = loadPage;
        window.showToast = function(msg, type) {
            var toast = document.createElement('div');
            toast.style.position = 'fixed';
            toast.style.bottom = '20px';
            toast.style.right = '20px';
            toast.style.background = 'var(--bg-card)';
            toast.style.borderLeft = '4px solid ' + (type === 'success' ? 'var(--success)' : 'var(--danger)');
            toast.style.padding = '12px 20px';
            toast.style.borderRadius = '10px';
            toast.style.zIndex = '1100';
            toast.style.color = 'var(--text-primary)';
            toast.innerHTML = msg;
            document.body.appendChild(toast);
            setTimeout(function() { toast.remove(); }, 3000);
        };
        
        setupEventListeners();
        init();
    </script>
</body>
</html>
