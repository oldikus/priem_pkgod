<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему - Приемная комиссия</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e27;
            --bg-card: #151a3a;
            --border: #252a4a;
            --primary: #6c5ce7;
            --secondary: #a855f7;
            --text-primary: #ffffff;
            --text-secondary: #a2a8d4;
            --success: #10b981;
            --danger: #ef4444;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
        }
        
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-card {
            background: var(--bg-card);
            border-radius: 32px;
            padding: 48px;
            max-width: 420px;
            width: 100%;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.5s ease;
        }
        
        .login-logo { text-align: center; margin-bottom: 32px; }
        .login-logo svg { width: 60px; height: 60px; color: var(--primary); }
        
        .login-card h2 {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .login-card p { text-align: center; color: var(--text-secondary); font-size: 14px; margin-bottom: 32px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-secondary); }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 16px;
            font-size: 16px;
            color: var(--text-primary);
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
        }
        
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(108, 92, 231, 0.4); }
        .login-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        
        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }
        
        .alert-error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid var(--danger); }
        .alert-success { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid var(--success); }
        
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .test-accounts {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .test-accounts p { margin-bottom: 8px; text-align: left; }
        .test-accounts strong { color: var(--primary); }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
            </div>
            <h2>Добро пожаловать!</h2>
            <p>Войдите в систему приёмной комиссии</p>
            
            <div id="alert" class="alert"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" id="username" required placeholder="admin" autocomplete="off">
                </div>
                
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="login-btn" id="loginBtn">Войти в систему</button>
            </form>
            
            <div class="test-accounts">
                <p><strong>Тестовые учётные записи:</strong></p>
                <p>👑 <strong>admin</strong> / admin123 — полный доступ</p>
                <p>📊 <strong>osokin</strong> / 123456 — ответственный секретарь</p>
                <p>📊 <strong>tsygankova</strong> / 123456 — зам. ответственного секретаря</p>
                <p>📝 <strong>vorobyeva</strong> / 123456 — специалист</p>
                <p>📝 <strong>khanakova</strong> / 123456 — специалист</p>
            </div>
        </div>
    </div>
    
    <script>
        // ========== ВСЯ ЛОГИКА ВНУТРИ (БЕЗ ВНЕШНИХ ФАЙЛОВ) ==========
        
        const STORAGE_KEYS = {
            USERS: 'receipt_system_users',
            CURRENT_USER: 'receipt_system_current_user',
            RECEIPTS: 'receipt_system_receipts',
            COUNTERS: 'receipt_system_counters'
        };
        
        // Функция хеширования пароля
        function hashPassword(password) {
            let hash = 0;
            for (let i = 0; i < password.length; i++) {
                const char = password.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return hash.toString();
        }
        
        // СОЗДАЁМ ПОЛЬЗОВАТЕЛЕЙ ТОЛЬКО ОДИН РАЗ (при первом запуске)
        function initializeUsers() {
            const existing = localStorage.getItem(STORAGE_KEYS.USERS);
            if (existing) {
                console.log('📁 Пользователи уже есть в системе');
                return JSON.parse(existing);
            }
            
            console.log('👑 Первый запуск, создаём пользователей...');
            
            const users = {
                'admin': {
                    id: 'admin_1',
                    login: 'admin',
                    password: hashPassword('admin123'),
                    name: 'Главный Администратор',
                    role: 'admin',
                    position: 'Главный администратор',
                    phone: '+7 (499) 156-40-01',
                    createdAt: new Date().toISOString(),
                    isActive: true,
                    canViewStats: true
                },
                'osokin': {
                    id: 'emp_1',
                    login: 'osokin',
                    password: hashPassword('123456'),
                    name: 'Осокин Константин Вячеславович',
                    role: 'both',
                    position: 'Ответственный секретарь',
                    phone: '+7 (499) 156-40-02',
                    createdAt: new Date().toISOString(),
                    isActive: true,
                    canViewStats: true
                },
                'tsygankova': {
                    id: 'emp_2',
                    login: 'tsygankova',
                    password: hashPassword('123456'),
                    name: 'Цыганкова Юлия Игоревна',
                    role: 'both',
                    position: 'Заместитель ответственного секретаря',
                    phone: '+7 (499) 156-40-03',
                    createdAt: new Date().toISOString(),
                    isActive: true,
                    canViewStats: true
                },
                'vorobyeva': {
                    id: 'emp_3',
                    login: 'vorobyeva',
                    password: hashPassword('123456'),
                    name: 'Воробьева Ирина Алексеевна',
                    role: 'employee',
                    position: 'Специалист',
                    phone: '+7 (499) 156-40-04',
                    createdAt: new Date().toISOString(),
                    isActive: true,
                    canViewStats: false
                },
                'khanakova': {
                    id: 'emp_4',
                    login: 'khanakova',
                    password: hashPassword('123456'),
                    name: 'Ханакова Анастасия Ивановна',
                    role: 'employee',
                    position: 'Специалист',
                    phone: '+7 (499) 156-40-05',
                    createdAt: new Date().toISOString(),
                    isActive: true,
                    canViewStats: false
                }
            };
            
            localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users));
            
            // Инициализируем пустые массивы для данных
            if (!localStorage.getItem(STORAGE_KEYS.RECEIPTS)) {
                localStorage.setItem(STORAGE_KEYS.RECEIPTS, JSON.stringify([]));
            }
            if (!localStorage.getItem(STORAGE_KEYS.COUNTERS)) {
                localStorage.setItem(STORAGE_KEYS.COUNTERS, JSON.stringify({}));
            }
            
            console.log('✅ Пользователи созданы:', Object.keys(users).join(', '));
            return users;
        }
        
        // Функция входа
        function doLogin(login, password) {
            const users = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS) || '{}');
            const user = users[login];
            
            if (!user) {
                return { success: false, error: `Пользователь "${login}" не найден` };
            }
            
            if (!user.isActive) {
                return { success: false, error: 'Аккаунт деактивирован. Обратитесь к администратору' };
            }
            
            if (user.password !== hashPassword(password)) {
                return { success: false, error: 'Неверный пароль' };
            }
            
            // Создаём сессию
            const session = {
                userId: user.id,
                login: user.login,
                name: user.name,
                role: user.role,
                position: user.position,
                phone: user.phone,
                canViewStats: user.canViewStats || false,
                loginTime: new Date().toISOString()
            };
            
            localStorage.setItem(STORAGE_KEYS.CURRENT_USER, JSON.stringify(session));
            
            return { success: true, user: session };
        }
        
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alert');
            alertDiv.textContent = message;
            alertDiv.className = `alert alert-${type}`;
            alertDiv.style.display = 'block';
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 3000);
        }
        
        // ИНИЦИАЛИЗАЦИЯ ПРИ ЗАГРУЗКЕ
        initializeUsers();
        
        // Обработчик формы входа
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const login = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const originalText = loginBtn.innerHTML;
            
            if (!login || !password) {
                showAlert('Заполните все поля', 'error');
                return;
            }
            
            loginBtn.innerHTML = '<span class="spinner"></span> Вход...';
            loginBtn.disabled = true;
            
            // Небольшая задержка для имитации процесса
            setTimeout(() => {
                const result = doLogin(login, password);
                
                if (result.success) {
                    showAlert(`Добро пожаловать, ${result.user.name}! Перенаправление...`, 'success');
                    
                    setTimeout(() => {
                        if (result.user.role === 'admin' || result.user.role === 'both') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'dashboard.html';
                        }
                    }, 500);
                } else {
                    showAlert(result.error, 'error');
                    loginBtn.innerHTML = originalText;
                    loginBtn.disabled = false;
                }
            }, 300);
        });
        
        // Вход по Enter
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
        
        console.log('✅ Страница входа загружена, всё готово');
    </script>
</body>
</html>
