<div class="form-container">
    <h2>📤 Экспорт данных в ФИС ГИА</h2>
    <div class="stats-grid" style="margin-bottom: 20px;">
        <div class="stat-card"><div class="stat-icon">📄</div><div class="stat-value" id="exportCount">0</div><div class="stat-label">Абитуриентов для экспорта</div></div>
        <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-value" id="validCount">0</div><div class="stat-label">Валидных записей</div></div>
        <div class="stat-card"><div class="stat-icon">⚠️</div><div class="stat-value" id="invalidCount">0</div><div class="stat-label">Требуют проверки</div></div>
    </div>
    <div class="form-row" style="margin-bottom: 20px;">
        <div class="form-group"><label>Формат выгрузки</label><select id="exportFormat"><option value="csv">CSV</option><option value="xml">XML</option><option value="json">JSON</option></select></div>
        <div class="form-group"><label>Период</label><select id="exportPeriod"><option value="all">Все данные</option><option value="today">За сегодня</option><option value="week">За неделю</option><option value="month">За месяц</option></select></div>
    </div>
    <button class="add-btn" onclick="validateAndExport()" style="width: 100%; margin-bottom: 10px;">🔍 Валидировать и подготовить к выгрузке</button>
    <button class="submit-btn" onclick="exportToFIS()" id="exportBtn">📥 Экспортировать в ФИС ГИА</button>
    <div id="validationResults" style="margin-top: 20px; max-height: 300px; overflow-y: auto;"></div>
</div>
<script>
    var exportData = null;
    
    function escapeXml(str) { 
        if (!str) return '';
        return str.replace(/[<>&]/g, function(m) { return m === '<' ? '&lt;' : m === '>' ? '&gt;' : '&amp;'; }); 
    }
    
    function validateAndExport() {
        var receipts = getAllReceipts();
        var period = document.getElementById('exportPeriod').value;
        var now = new Date();
        var filtered = receipts.filter(function(r) {
            var date = new Date(r.createdAt);
            if (period === 'today') return date.toDateString() === now.toDateString();
            if (period === 'week') return (now - date) <= 7 * 24 * 3600000;
            if (period === 'month') return (now - date) <= 30 * 24 * 3600000;
            return true;
        });
        
        var valid = filtered.filter(function(r) { return r.fullName && r.specialty && r.score && parseInt(r.score) > 0; });
        var invalid = filtered.filter(function(r) { return !r.fullName || !r.specialty || !r.score; });
        
        document.getElementById('exportCount').innerHTML = filtered.length;
        document.getElementById('validCount').innerHTML = valid.length;
        document.getElementById('invalidCount').innerHTML = invalid.length;
        
        var resultsHtml = '<div style="max-height:200px; overflow-y:auto;">';
        if (invalid.length > 0) {
            resultsHtml += '<p style="color: var(--warning);">⚠️ Требуют проверки:</p><ul>';
            for (var i = 0; i < invalid.length; i++) {
                var r = invalid[i];
                resultsHtml += '<li>' + (r.fullName || 'Без ФИО') + ' - ' + (r.specialty || 'нет специальности') + ' - баллы: ' + (r.score || 'не указаны') + '</li>';
            }
            resultsHtml += '</ul>';
        } else {
            resultsHtml += '<p style="color: var(--success);">✅ Все данные валидны, можно выполнять выгрузку</p>';
        }
        resultsHtml += '</div>';
        document.getElementById('validationResults').innerHTML = resultsHtml;
        exportData = { valid: valid, format: document.getElementById('exportFormat').value };
    }
    
    function exportToFIS() {
        if (!exportData || exportData.valid.length === 0) {
            if (window.showToast) window.showToast('Сначала выполните валидацию данных', 'error');
            return;
        }
        var data = exportData.valid;
        var format = exportData.format;
        var content = '';
        
        if (format === 'csv') {
            var headers = ['ФИО', 'Специальность', 'Баллы ГИА', 'Номер аттестата', 'Дата выдачи', 'Дата подачи'];
            var rows = [];
            for (var i = 0; i < data.length; i++) {
                var r = data[i];
                rows.push([r.fullName, r.specialty, r.score, r.diplomaNumber || '', r.diplomaDate || '', new Date(r.createdAt).toLocaleDateString('ru-RU')]);
            }
            var csvRows = [headers].concat(rows);
            var csvContent = '';
            for (var i = 0; i < csvRows.length; i++) {
                var row = csvRows[i];
                var escapedRow = [];
                for (var j = 0; j < row.length; j++) {
                    escapedRow.push('"' + row[j] + '"');
                }
                csvContent += escapedRow.join(';') + (i < csvRows.length - 1 ? '\n' : '');
            }
            var blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
            var link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'export_fis_gia_' + new Date().toISOString().slice(0,10) + '.csv';
            link.click();
        } else if (format === 'xml') {
            content = '<?xml version="1.0" encoding="UTF-8"?>\n<export>\n';
            for (var i = 0; i < data.length; i++) {
                var r = data[i];
                content += '  <applicant>\n    <fullName>' + escapeXml(r.fullName) + '</fullName>\n    <specialty>' + escapeXml(r.specialty) + '</specialty>\n    <score>' + r.score + '</score>\n    <diplomaNumber>' + escapeXml(r.diplomaNumber || '') + '</diplomaNumber>\n    <createdAt>' + new Date(r.createdAt).toISOString() + '</createdAt>\n  </applicant>\n';
            }
            content += '</export>';
            var blob = new Blob([content], { type: 'application/xml' });
            var link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'export_fis_gia_' + new Date().toISOString().slice(0,10) + '.xml';
            link.click();
        } else {
            var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            var link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'export_fis_gia_' + new Date().toISOString().slice(0,10) + '.json';
            link.click();
        }
        if (window.showToast) window.showToast('Экспорт выполнен успешно', 'success');
    }
</script>
