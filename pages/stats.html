<div class="stats-grid" id="statsGrid"></div>
<div class="stats-grid" id="chartsGrid" style="grid-template-columns: 1fr 1fr; margin-bottom: 32px;">
    <div class="stat-card"><canvas id="trendChart" style="max-height: 200px;"></canvas></div>
    <div class="stat-card"><canvas id="specialtyChart" style="max-height: 200px;"></canvas></div>
</div>
<div class="table-container">
    <div class="table-header"><h3>🏆 Рейтинг сотрудников</h3></div>
    <table class="data-table"><thead><tr><th>#</th><th>Сотрудник</th><th>Должность</th><th>Расписок</th><th>Статус</th></tr></thead><tbody id="employeeStatsBody"></tbody></table>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="../config.js"></script>
<script src="../auth.js"></script>
<script>
    (function() {
        let trendChart = null, specialtyChart = null;
        
        function loadStats() {
            const stats = getSystemStats();
            document.getElementById('statsGrid').innerHTML = 
                '<div class="stat-card"><div class="stat-icon">📄</div><div class="stat-value">' + (stats.totalReceipts || 0) + '</div><div class="stat-label">Всего расписок</div></div>' +
                '<div class="stat-card"><div class="stat-icon">📅</div><div class="stat-value">' + (stats.todayReceipts || 0) + '</div><div class="stat-label">Сегодня</div></div>' +
                '<div class="stat-card"><div class="stat-icon">👥</div><div class="stat-value">' + (stats.totalEmployees || 0) + '</div><div class="stat-label">Сотрудников</div></div>' +
                '<div class="stat-card"><div class="stat-icon">⭐</div><div class="stat-value">' + (stats.totalReceipts > 0 ? Math.round((stats.todayReceipts / stats.totalReceipts) * 100) : 0) + '%</div><div class="stat-label">Активность сегодня</div></div>';
            
            // Рейтинг сотрудников
            const sorted = (stats.employeeStats || []).slice();
            sorted.sort((a,b) => (b.receiptCount||0) - (a.receiptCount||0));
            let html = '';
            for (let i = 0; i < sorted.length; i++) {
                const e = sorted[i];
                const rankClass = i === 0 ? 'rank-1' : (i === 1 ? 'rank-2' : (i === 2 ? 'rank-3' : ''));
                html += '<tr><td><span class="rank-badge ' + rankClass + '">' + (i+1) + '</span></td><td><strong>' + e.name + '</strong></td><td>' + (e.position || '-') + '</td><td style="font-weight:700;color:var(--primary)">' + (e.receiptCount||0) + '</td><td><span class="status-badge ' + (e.isActive ? 'status-active' : 'status-inactive') + '">' + (e.isActive ? 'Активен' : 'Неактивен') + '</span></td></tr>';
            }
            document.getElementById('employeeStatsBody').innerHTML = html;
            
            // Графики
            const receipts = getAllReceipts();
            const last7Days = [];
            const dailyCounts = [];
            for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); last7Days.push(d.toLocaleDateString('ru-RU')); dailyCounts.push(0); }
            receipts.forEach(r => { const d = new Date(r.createdAt).toLocaleDateString('ru-RU'); const idx = last7Days.indexOf(d); if (idx !== -1) dailyCounts[idx]++; });
            
            const specialtyStats = stats.specialtyStats || {};
            const specialtyLabels = Object.keys(specialtyStats);
            const specialtyCounts = Object.values(specialtyStats);
            
            if (trendChart) trendChart.destroy();
            if (specialtyChart) specialtyChart.destroy();
            
            const ctx1 = document.getElementById('trendChart').getContext('2d');
            trendChart = new Chart(ctx1, { type: 'line', data: { labels: last7Days, datasets: [{ label: 'Расписки', data: dailyCounts, borderColor: '#4f46e5', fill: true }] }, options: { responsive: true, maintainAspectRatio: true } });
            
            const ctx2 = document.getElementById('specialtyChart').getContext('2d');
            specialtyChart = new Chart(ctx2, { type: 'doughnut', data: { labels: specialtyLabels, datasets: [{ data: specialtyCounts, backgroundColor: ['#4f46e5','#7c3aed','#10b981','#f59e0b','#ef4444'] }] }, options: { responsive: true } });
        }
        
        loadStats();
    })();
</script>
