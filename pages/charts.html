<div class="chart-container"><canvas id="receiptsChart"></canvas></div>
<div class="chart-container"><canvas id="specialtyChart"></canvas></div>
<div class="chart-container"><canvas id="trendChart"></canvas></div>
<script>
    (function() {
        if (typeof window.loadChartsPage === 'function') {
            window.loadChartsPage();
        } else {
            var receipts = getAllReceipts();
            var last7Days = [];
            var dailyCounts = [];
            for (var i = 6; i >= 0; i--) { 
                var d = new Date(); 
                d.setDate(d.getDate() - i); 
                last7Days.push(d.toLocaleDateString('ru-RU')); 
                dailyCounts.push(0); 
            }
            for (var i = 0; i < receipts.length; i++) {
                var r = receipts[i];
                var d = new Date(r.createdAt).toLocaleDateString('ru-RU');
                var idx = last7Days.indexOf(d);
                if (idx !== -1) dailyCounts[idx]++;
            }
            
            var specialtyStats = getSystemStats().specialtyStats || {};
            var specialtyLabels = Object.keys(specialtyStats);
            var specialtyCounts = Object.values(specialtyStats);
            
            var ctx1 = document.getElementById('receiptsChart');
            if (ctx1) {
                if (window.receiptsChart) window.receiptsChart.destroy();
                window.receiptsChart = new Chart(ctx1.getContext('2d'), { 
                    type: 'line', 
                    data: { labels: last7Days, datasets: [{ label: 'Количество расписок', data: dailyCounts, borderColor: 'var(--primary)', backgroundColor: 'rgba(79,70,229,0.1)', fill: true, tension: 0.3 }] }, 
                    options: { responsive: true, maintainAspectRatio: true } 
                });
            }
            
            var ctx2 = document.getElementById('specialtyChart');
            if (ctx2) {
                if (window.specialtyChart) window.specialtyChart.destroy();
                window.specialtyChart = new Chart(ctx2.getContext('2d'), { 
                    type: 'doughnut', 
                    data: { labels: specialtyLabels, datasets: [{ data: specialtyCounts, backgroundColor: ['#4f46e5', '#7c3aed', '#10b981', '#f59e0b', '#ef4444', '#06b6d4', '#ec4899'] }] }, 
                    options: { responsive: true } 
                });
            }
            
            var ctx3 = document.getElementById('trendChart');
            if (ctx3) {
                if (window.trendChart) window.trendChart.destroy();
                var monthlyStats = {};
                for (var i = 0; i < receipts.length; i++) {
                    var r = receipts[i];
                    var m = new Date(r.createdAt).toLocaleString('ru-RU', { month: 'short' });
                    monthlyStats[m] = (monthlyStats[m] || 0) + 1;
                }
                window.trendChart = new Chart(ctx3.getContext('2d'), { 
                    type: 'bar', 
                    data: { labels: Object.keys(monthlyStats), datasets: [{ label: 'Заявлений по месяцам', data: Object.values(monthlyStats), backgroundColor: 'var(--primary)', borderRadius: 8 }] }, 
                    options: { responsive: true } 
                });
            }
        }
    })();
</script>
